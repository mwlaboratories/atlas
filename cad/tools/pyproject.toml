[project]
name = "atlas-case"
version = "0.1.0"
description = "Atlas keyboard case, generated from the KiCad boards with build123d"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d==0.13.0",
    "numpy",            # numpy/scipy/pillow: raster thin-wall check
    "scipy",
    "pillow",
    "shapely>=2.2.0",   # bottom plate pockets: 2D polygon morphology (atlas_case/geom2d.py)
]

[tool.uv]
package = false
