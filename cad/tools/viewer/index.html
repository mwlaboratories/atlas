<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas case</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1d2330; --muted: #677084; --line: #dde1e8;
    --ok: #2f7d4f; --fail: #c62f2f; --warn: #d9822b; --accent: #187292;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --ink: #e6e9ef; --muted: #98a1b3; --line: #2c323c; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: grid; height: 100%; grid-template-columns: 1fr 320px;
    grid-template-rows: auto 1fr 0; grid-template-areas: "head head" "main side" "pairs side"; }
  #app.pairs-on { grid-template-rows: auto 1fr 300px; }
  #pairs { display: none; }
  #app.pairs-on #pairs { display: grid; }
  header { grid-area: head; display: flex; align-items: center; gap: 16px; padding: 8px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sp { flex: 1; }
  .pill { padding: 2px 10px; border-radius: 99px; font-weight: 600; font-size: 12px; }
  .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.fail { background: color-mix(in srgb, var(--fail) 18%, transparent); color: var(--fail); }
  .pill.wait { background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--muted); }
  .seg button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 4px 12px; cursor: pointer; font: inherit; }
  .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #main { grid-area: main; position: relative; }
  #pairs { grid-area: pairs; grid-template-columns: repeat(5, 1fr); gap: 6px;
    padding: 6px; border-top: 1px solid var(--line); }
  .view { position: relative; border-radius: 6px; overflow: hidden; }
  #pairs .view { border: 1px solid var(--line); }
  .view .label { position: absolute; left: 8px; top: 6px; font-weight: 600; font-size: 12px;
    pointer-events: none; text-shadow: 0 0 3px var(--bg); }
  .view .label i { font-style: normal; display: inline-block; width: 9px; height: 9px;
    border-radius: 2px; margin: 0 3px 0 6px; vertical-align: -1px; }
  .view .ctl { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex; gap: 6px;
    align-items: center; font-size: 11px; color: var(--muted); }
  .view .ctl input[type=range] { flex: 1; }
  #side { grid-area: side; border-left: 1px solid var(--line); background: var(--panel);
    overflow: auto; padding: 10px 12px; }
  #side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 14px 0 6px; }
  #side h2:first-child { margin-top: 0; }
  .chk { padding: 5px 6px; border-radius: 5px; cursor: pointer; display: grid;
    grid-template-columns: 34px 1fr; gap: 4px; }
  .chk:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .chk b { font-size: 11px; } .chk b.ok { color: var(--ok); } .chk b.fail { color: var(--fail); }
  .chk span { color: var(--ink); } .chk small { color: var(--muted); display: block; }
  .toggles label { display: inline-flex; align-items: center; gap: 4px; margin: 0 10px 4px 0; }
  .marker { position: absolute; transform: translate(-50%, -50%); pointer-events: none;
    font-size: 11px; font-weight: 600; white-space: nowrap; }
  .marker::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 4px; vertical-align: -1px; border: 2px solid #fff; }
  .marker.fail { color: var(--fail); } .marker.fail::before { background: var(--fail); }
  .marker.warn { color: var(--warn); } .marker.warn::before { background: var(--warn); }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 12px;
    border-radius: 6px; cursor: pointer; font: inherit; }
  .tog { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  #status { color: var(--muted); font-size: 12px; max-width: 45%; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .skipped { color: var(--warn); font-size: 12px; padding: 2px 6px 6px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="app">
  <header>
    <h1>Atlas case</h1>
    <div class="seg" id="halves"><button data-h="left" class="on">Left</button><button data-h="right">Right</button></div>
    <span id="summary" class="pill wait">checks pending</span>
    <label class="tog"><input type="checkbox" id="pairtoggle"> pair views</label>
    <button id="top" class="btn" title="orthographic, straight down — for judging gaps">Top</button>
    <button id="persp" class="btn">3D</button>
    <button id="centre" class="btn">Centre</button>
    <span class="sp"></span>
    <span id="status">loading…</span>
  </header>
  <div id="main" class="view">
    <div class="label">Assembly</div>
    <div class="ctl">explode <input id="explode" type="range" min="0" max="30" value="0" step="0.5">
      section <input id="section" type="range" min="-7" max="6" value="6" step="0.1"><span id="secv">off</span></div>
  </div>
  <div id="pairs"></div>
  <aside id="side">
    <h2>Parts</h2><div class="toggles" id="toggles"></div>
    <h2>Fit checks</h2><div id="checks"><span id="status2" class="pill wait">waiting for the first build</span></div>
  </aside>
</div>
<script type="module" src="viewer.js"></script>
</body>
</html>
