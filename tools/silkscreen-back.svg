<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="116mm" height="88mm" viewBox="0 0 116 88">
  <!-- Atlas Keyboard — Back Silkscreen (Left Half)
       Bathymetric/ocean depth chart complement to front topo
       All strokes 0.15mm+ for PCB silkscreen compatibility -->

  <g fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">

    <!-- ═══════════════════════════════════════════════════════
         BATHYMETRIC DEPTH CONTOURS
         Inverse of front — these suggest ocean depth/undersea
         terrain. Softer, more widely spaced curves.
         ═══════════════════════════════════════════════════════ -->

    <!-- Wide sweeping depth contours -->
    <path d="M 2,20 C 12,24 24,30 36,34 C 48,38 60,40 72,38
             C 84,36 96,30 108,24 C 112,22 114,20 114,18"
          stroke-width="0.18" opacity="0.2"/>

    <path d="M 2,32 C 14,36 28,42 42,46 C 56,50 68,50 80,46
             C 92,42 104,36 114,30"
          stroke-width="0.18" opacity="0.22"/>

    <path d="M 2,44 C 16,48 32,54 48,56 C 64,58 78,56 90,50
             C 100,45 110,38 114,34"
          stroke-width="0.18" opacity="0.18"/>

    <path d="M 4,56 C 18,60 34,64 50,64 C 66,64 80,60 92,54
             C 102,49 112,42 114,40"
          stroke-width="0.18" opacity="0.15"/>

    <path d="M 6,68 C 20,70 36,72 52,70 C 68,68 82,62 94,56"
          stroke-width="0.18" opacity="0.12"/>

    <!-- Tighter depth rings — "deep trench" near center -->
    <path d="M 30,42 C 38,46 48,50 58,50 C 68,50 76,46 82,40"
          stroke-width="0.20" opacity="0.3"/>

    <path d="M 36,44 C 44,48 54,50 62,48 C 70,46 76,42 78,38"
          stroke-width="0.20" opacity="0.28"/>

    <path d="M 42,46 C 50,48 58,48 64,46 C 70,43 74,40 74,36"
          stroke-width="0.20" opacity="0.25"/>

    <!-- ═══════════════════════════════════════════════════════
         DEPTH SOUNDINGS
         Scattered depth numbers, nautical chart style
         ═══════════════════════════════════════════════════════ -->
    <text x="20" y="28" font-family="monospace" font-size="1.8" fill="white"
          stroke="none" opacity="0.2" font-style="italic">12</text>
    <text x="50" y="42" font-family="monospace" font-size="1.8" fill="white"
          stroke="none" opacity="0.2" font-style="italic">48</text>
    <text x="70" y="36" font-family="monospace" font-size="1.8" fill="white"
          stroke="none" opacity="0.2" font-style="italic">36</text>
    <text x="90" y="30" font-family="monospace" font-size="1.8" fill="white"
          stroke="none" opacity="0.2" font-style="italic">24</text>
    <text x="35" y="58" font-family="monospace" font-size="1.8" fill="white"
          stroke="none" opacity="0.2" font-style="italic">60</text>
    <text x="75" y="52" font-family="monospace" font-size="1.8" fill="white"
          stroke="none" opacity="0.2" font-style="italic">42</text>

    <!-- ═══════════════════════════════════════════════════════
         CARTOUCHE — map legend box
         ═══════════════════════════════════════════════════════ -->
    <rect x="6" y="72" width="38" height="12" rx="0.5" stroke-width="0.18" opacity="0.3"/>
    <line x1="6" y1="77" x2="44" y2="77" stroke-width="0.15" opacity="0.2"/>

    <text x="25" y="75.8" font-family="monospace" font-size="2.8" fill="white"
          stroke="none" opacity="0.45" text-anchor="middle" letter-spacing="1.8">ATLAS</text>
    <text x="25" y="80" font-family="monospace" font-size="1.4" fill="white"
          stroke="none" opacity="0.25" text-anchor="middle" letter-spacing="0.8">34-KEY SPLIT ERGO</text>
    <text x="25" y="82.2" font-family="monospace" font-size="1.1" fill="white"
          stroke="none" opacity="0.2" text-anchor="middle" letter-spacing="0.5">CHOC V1 / BLE / TRACKPOINT</text>

    <!-- ═══════════════════════════════════════════════════════
         COMPASS ROSE (simplified)
         ═══════════════════════════════════════════════════════ -->
    <g transform="translate(100, 76)" opacity="0.3">
      <!-- Outer ring -->
      <circle r="5" stroke-width="0.18"/>
      <!-- Cardinal lines -->
      <line x1="0" y1="-5" x2="0" y2="5" stroke-width="0.15"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke-width="0.15"/>
      <!-- Intercardinal lines -->
      <line x1="-3.5" y1="-3.5" x2="3.5" y2="3.5" stroke-width="0.12"/>
      <line x1="3.5" y1="-3.5" x2="-3.5" y2="3.5" stroke-width="0.12"/>
      <!-- North pointer -->
      <polygon points="0,-5 -1.2,-2 1.2,-2" stroke-width="0.15" fill="white"/>
      <!-- Cardinal letters -->
      <text x="0" y="-6.2" font-family="monospace" font-size="1.6" fill="white"
            stroke="none" text-anchor="middle">N</text>
      <text x="6.5" y="0.5" font-family="monospace" font-size="1.3" fill="white"
            stroke="none" text-anchor="middle">E</text>
      <text x="0" y="7.5" font-family="monospace" font-size="1.3" fill="white"
            stroke="none" text-anchor="middle">S</text>
      <text x="-6.5" y="0.5" font-family="monospace" font-size="1.3" fill="white"
            stroke="none" text-anchor="middle">W</text>
    </g>

    <!-- ═══════════════════════════════════════════════════════
         GRATICULE CROSSES
         Subtle + marks at regular intervals (nautical chart)
         ═══════════════════════════════════════════════════════ -->
    <g stroke-width="0.12" opacity="0.15">
      <line x1="28" y1="18" x2="32" y2="18"/><line x1="30" y1="16" x2="30" y2="20"/>
      <line x1="58" y1="18" x2="62" y2="18"/><line x1="60" y1="16" x2="60" y2="20"/>
      <line x1="88" y1="18" x2="92" y2="18"/><line x1="90" y1="16" x2="90" y2="20"/>
      <line x1="28" y1="38" x2="32" y2="38"/><line x1="30" y1="36" x2="30" y2="40"/>
      <line x1="58" y1="38" x2="62" y2="38"/><line x1="60" y1="36" x2="60" y2="40"/>
      <line x1="88" y1="38" x2="92" y2="38"/><line x1="90" y1="36" x2="90" y2="40"/>
      <line x1="28" y1="58" x2="32" y2="58"/><line x1="30" y1="56" x2="30" y2="60"/>
      <line x1="58" y1="58" x2="62" y2="58"/><line x1="60" y1="56" x2="60" y2="60"/>
      <line x1="88" y1="58" x2="92" y2="58"/><line x1="90" y1="56" x2="90" y2="60"/>
    </g>

    <!-- Version / credit tiny text -->
    <text x="114" y="86" font-family="monospace" font-size="1.0" fill="white"
          stroke="none" opacity="0.15" text-anchor="end">v1.0</text>

  </g>
</svg>
