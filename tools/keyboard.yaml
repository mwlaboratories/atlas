# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Atlas — Declarative Keyboard Layout                               ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# This file defines the full keyboard geometry. Only the left half is
# specified — the right half is automatically mirrored.
#
# Units
# ─────
#   Layout:   key units (1u = 19.05 mm, the standard MX center-to-center)
#   Physical: millimetres (mm)
#   Angles:   degrees (0° = up, positive = clockwise)
#
# Coordinate system (matches KLE)
# ────────────────────────────────
#   Origin (0,0) = top-left of pinky column (col 0)
#   X → rightward, Y ↓ downward
#
# ──────────────────────────────────────────────────────────────────────

# --- Switch ---
# The physical switch and keycap determine spacing and visual size.
#
#   spacing:  center-to-center distance between adjacent switches.
#   keycap:   visible keycap footprint (affects overlap detection in KLE).
#
# Common values:
#   MX:            spacing [1, 1]         keycap [1, 1]          (19.05 mm switch, 19.05 mm cap)
#   Choc V1:       spacing [0.945, 0.893] keycap [0.92, 0.87]   (18 × 17 mm switch, 17.5 × 16.5 mm cap)
#   Choc V2:       spacing [1, 1]         keycap [0.945, 0.945]  (19.05 mm switch, 18 mm MX-stem cap)
#
switch:
  type: choc_v1                        # Kailh Choc V1 — Ambients Nocturnal
  spacing: [0.945, 0.893]             # [x, y] center-to-center (key units) — Choc V1: 18 × 17 mm
  keycap: [0.92, 0.87]               # [w, h] keycap size (key units) — Choc V1: 17.5 × 16.5 mm
  cutout: 14.0                         # plate cutout side length (mm) — Choc V1 / Ambients: 14×14mm
  # Footprint used by kbplacer (kiswitch library).
  # Available options (library:footprint):
  #
  #   Hotswap:
  #     Switch_Keyboard_Hotswap_Kailh:SW_Hotswap_Kailh_Choc_V1          (standard)
  #     Switch_Keyboard_Hotswap_Kailh:SW_Hotswap_Kailh_Choc_V1_plated   (plated holes)
  #     Switch_Keyboard_Hotswap_Kailh:SW_Hotswap_Kailh_Choc_V1V2        (V1/V2 combo)
  #     Switch_Keyboard_Hotswap_Kailh:SW_Hotswap_Kailh_MX               (MX hotswap)
  #
  #   Solder (through-hole):
  #     Switch_Keyboard_Kailh:SW_Kailh_Choc_V1                          (standard)
  #     Switch_Keyboard_Kailh:SW_Kailh_Choc_V1V2                        (V1/V2 combo)
  #     Switch_Keyboard_Kailh:SW_Kailh_Choc_V2                          (V2 only)
  #     Switch_Keyboard_Cherry_MX:SW_Cherry_MX_PCB                      (MX PCB mount)
  #     Switch_Keyboard_Cherry_MX:SW_Cherry_MX_Plate                    (MX plate mount)
  #
  #   Size suffix _1.00u is appended automatically by kbplacer.
  footprint: "Switch_Keyboard_Hotswap_Kailh:SW_Hotswap_Kailh_Choc_V1"

# --- Grid ---
# 5 columns × 3 rows per half. Only the left half is defined.
#
#   cols/rows:  grid dimensions per half.
#   stagger:    vertical offset per column (key units, negative = higher).
#               Measured from pinky (col 0) baseline.
#
# Columns: pinky=0, ring=1, middle=2, index=3, inner=4
# Rows:    top=0, home=1, bottom=2
#
# Stagger reference (approximate finger reach):
#   pinky (col 0):   0      baseline
#   ring (col 1):   -0.58   ~11 mm higher — ring finger is longer than pinky
#   middle (col 2): -0.74   ~14 mm higher — middle finger is the longest
#   index (col 3):  -0.58   ~11 mm higher — index ≈ ring length
#   inner (col 4):  -0.48   ~9 mm higher  — slight reach inward
#
# Visual (left half, top row, showing stagger):
#
#                   ┌───┐                              stagger = -0.74
#           ┌───┐   │0,2│   ┌───┐                     stagger = -0.58
#           │0,1│   └───┘   │0,3│   ┌───┐             stagger = -0.48
#           └───┘           └───┘   │0,4│
#   ┌───┐                           └───┘             stagger = 0
#   │0,0│
#   └───┘
#
grid:
  cols: 5
  rows: 3
  stagger: [0, -0.58, -0.74, -0.58, -0.48]   # [pinky, ring, middle, index, inner]

# --- Rotated keys (disabled) ---
# Rotate individual grid keys around their center (e.g. to clear a trackpoint).
# Uncomment and adjust as needed. Rotation is negated on the mirrored right half.
#
# rotated_keys:
#   - { row: 1, col: 3, rotation: -180 }  # index home
#   - { row: 0, col: 4, rotation: 90 }    # inner top
#   - { row: 1, col: 4, rotation: 90 }    # inner home

# --- Thumb cluster ---
# Only the left half is defined; the right half is mirrored automatically.
#
# Placement model:
#   The first thumb key's top-left corner is placed at the bottom-right
#   corner of the last ortho key (2,4) + the grid gap. Then it's rotated.
#   Each subsequent key chains from the previous one, maintaining the
#   same gap between adjacent keycap edges.
#
#   anchor (key 2,4)
#     ┌───────┐
#     │       │
#     •───────┘
#     ↓ gap
#     •───────┐     ┌───────┐
#  tl │  3,3  │     │  3,4  │
#     └───────•─gap─•───────┘
#
# keys:        number of thumb keys per half.
# angle:       rotation of the first thumb key (degrees CW).
# angle_step:  additional rotation per subsequent key (degrees CW).
# offset:      [dx, dy] optional shift of first key from default position.
#
# Gap between keys is automatically matched to the ortho grid gap.
# At angle=0 and angle_step=0, thumb keys align flush with ortho spacing.
#
thumb:
  keys: 2
  angle: 14                    # first key rotation (degrees CW)
  angle_step: 7                # additional rotation per key (degrees CW)
  offset: [0.23, 0]             # [dx, dy] shift of first key — ~1/4 keycap width right

# ──────────────────────────────────────────────────────────────────────
# Physical dimensions below (mm). Used by pcb_enhance.py for trackpoint
# holes, controller placement, and edge cuts. Not used by layout2kle.py.
# ──────────────────────────────────────────────────────────────────────

# --- Controller ---
# XIAO BLE (nRF52840) — placed above the outermost key by pcb_enhance.py.
#
controller:
  model: xiao_ble              # Seeed XIAO nRF52840 — BLE 5.0, 256KB RAM
  footprint: totem:xiao-ble-smd-cutout
  placement: above             # above the grid (between grid and PCB edge)
  edge_offset: -0.5           # shift along the edge (key units)
  standoff: 4.0               # distance from grid edge (mm)

# --- Trackpoint ---
# Sprintek all-in-one module — PS/2 via UART.
# Stick center = centroid of the 4 keys at the intersection of these cols/rows.
# Both halves carry a trackpoint module.
#
trackpoint:
  module: sprintek_aio         # Sprintek SK8707-01 all-in-one
  between: { cols: [3, 4], rows: [0, 1] }   # centroid of these 4 keys
  center_hole: 5.0             # stick hole diameter (mm) — from module datasheet
  screw_holes:
    diameter: 2.2              # M2 screw hole (mm)
    offset: 10.0               # Y distance from center to each screw (mm) — from module datasheet
  # Use solder (THT) footprint for the 4 keys surrounding the trackpoint.
  # This avoids the hotswap socket bulk that interferes with the trackpoint module.
  solder_keys: true
  solder_footprint: "Switch_Keyboard_Kailh:SW_Kailh_Choc_V1"
  # FFC connector for trackpoint flat cable — placed on B.Cu near middle finger column
  ffc:
    footprint: "Connector_FFC-FPC:Hirose_FH12-10S-0.5SH_1x10-1MP_P0.50mm_Horizontal"
    placement: trackpoint_center  # place relative to trackpoint center
    offset: [-18.0, -3.0]        # [x, y] mm offset from trackpoint center (left & up)
    rotation: 180                 # cable exits upward toward trackpoint

# --- Power switch ---
# C&K PCM13 — SP3T ultra-miniature slide switch (off / xiao / xiao+trackpoint)
# Placed on B.Cu near the controller area
power_switch:
  footprint: "Button_Switch_SMD:SW_SP3T_PCM13"
  placement: controller          # place near the XIAO controller
  offset: [18.0, -3.5]           # [x, y] mm offset from controller center (right & slightly up)
  rotation: 0

# --- Case ---
# Physical case dimensions for future CAD generation.
#
case:
  plate_padding: 2.0           # mm from switch cutout edge to outline
  wall: 2.0                    # outer wall thickness (mm)
  lip: 1.5                     # top lip overhang (mm)
  depth: 10.0                  # interior depth below plate (mm)
  corner_radius: 3.0          # fillet radius on outer corners (mm)
  plate_thickness: 1.5
  bottom_thickness: 2.0
  pcb_thickness: 1.6

# --- PCB ---
# Settings used by kbplacer (editor.keyboard-tools.xyz) when generating the PCB.
# These are reminders for the manual web tool step, not consumed by scripts.
#
pcb:
  trace_width: 0.25            # mm
  clearance: 0.2               # mm

# --- Per-half overrides ---
left:
  trackpoint: true
  connectors:
    - { name: tp_bridge, footprint: totem:5pin, near: trackpoint, side: above }
    - { name: battery,   footprint: totem:2pin, near: controller, side: below, offset: -15 }

right:
  trackpoint: true
  connectors:
    - { name: tp_bridge, footprint: totem:5pin, near: trackpoint, side: above }
    - { name: battery,   footprint: totem:2pin, near: controller, side: below, offset: -15 }
