# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Atlas — Declarative Keyboard Layout                               ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# This file defines the full keyboard geometry. Only the left half is
# specified — the right half is automatically mirrored.
#
# Units
# ─────
#   Layout:   key units (1u = 19.05 mm, the standard MX center-to-center)
#   Physical: millimetres (mm)
#   Angles:   degrees (0° = up, positive = clockwise)
#
# Coordinate system (matches KLE)
# ────────────────────────────────
#   Origin (0,0) = top-left of pinky column (col 0)
#   X → rightward, Y ↓ downward
#
# ──────────────────────────────────────────────────────────────────────

# --- Switch ---
# The physical switch and keycap determine spacing and visual size.
#
#   spacing:  center-to-center distance between adjacent switches.
#   keycap:   visible keycap footprint (affects overlap detection in KLE).
#
# Common values:
#   MX:            spacing [1, 1]         keycap [1, 1]          (19.05 mm switch, 19.05 mm cap)
#   Choc V1:       spacing [0.945, 0.893] keycap [0.92, 0.87]   (18 × 17 mm switch, 17.5 × 16.5 mm cap)
#   Choc V2:       spacing [1, 1]         keycap [0.945, 0.945]  (19.05 mm switch, 18 mm MX-stem cap)
#
switch:
  type: choc_v1                        # Kailh Choc V1 — Ambients Nocturnal
  spacing: [0.945, 0.893]             # [x, y] center-to-center (key units) — Choc V1: 18 × 17 mm
  keycap: [0.92, 0.87]               # [w, h] keycap size (key units) — Choc V1: 17.5 × 16.5 mm
  cutout: 14.0                         # plate cutout side length (mm) — Choc V1 / Ambients: 14×14mm
  box: [18.0, 17.0]                   # [w, h] footprint box (mm) — from Dwgs.User in kiswitch footprint
  # Footprint used by kbplacer (kiswitch library).
  # Available options (library:footprint):
  #
  #   Hotswap:
  #     Switch_Keyboard_Hotswap_Kailh:SW_Hotswap_Kailh_Choc_V1          (standard)
  #     Switch_Keyboard_Hotswap_Kailh:SW_Hotswap_Kailh_Choc_V1_plated   (plated holes)
  #     Switch_Keyboard_Hotswap_Kailh:SW_Hotswap_Kailh_Choc_V1V2        (V1/V2 combo)
  #     Switch_Keyboard_Hotswap_Kailh:SW_Hotswap_Kailh_MX               (MX hotswap)
  #
  #   Solder (through-hole):
  #     Switch_Keyboard_Kailh:SW_Kailh_Choc_V1                          (standard)
  #     Switch_Keyboard_Kailh:SW_Kailh_Choc_V1V2                        (V1/V2 combo)
  #     Switch_Keyboard_Kailh:SW_Kailh_Choc_V2                          (V2 only)
  #     Switch_Keyboard_Cherry_MX:SW_Cherry_MX_PCB                      (MX PCB mount)
  #     Switch_Keyboard_Cherry_MX:SW_Cherry_MX_Plate                    (MX plate mount)
  #
  #   Size suffix _1.00u is appended automatically by kbplacer.
  footprint: "Switch_Keyboard_Hotswap_Kailh:SW_Hotswap_Kailh_Choc_V1"
  symbol: "Switch:SW_Push"     # generic momentary switch — used by sch_build.py

# --- Grid ---
# 5 columns × 3 rows per half. Only the left half is defined.
#
#   cols/rows:  grid dimensions per half.
#   stagger:    vertical offset per column (key units, negative = higher).
#               Measured from pinky (col 0) baseline.
#
# Columns: pinky=0, ring=1, middle=2, index=3, inner=4
# Rows:    top=0, home=1, bottom=2
#
# Stagger reference (approximate finger reach):
#   pinky (col 0):   0      baseline
#   ring (col 1):   -0.58   ~11 mm higher — ring finger is longer than pinky
#   middle (col 2): -0.74   ~14 mm higher — middle finger is the longest
#   index (col 3):  -0.58   ~11 mm higher — index ≈ ring length
#   inner (col 4):  -0.48   ~9 mm higher  — slight reach inward
#
# Visual (left half, top row, showing stagger):
#
#                   ┌───┐                              stagger = -0.74
#           ┌───┐   │0,2│   ┌───┐                     stagger = -0.58
#           │0,1│   └───┘   │0,3│   ┌───┐             stagger = -0.48
#           └───┘           └───┘   │0,4│
#   ┌───┐                           └───┘             stagger = 0
#   │0,0│
#   └───┘
#
grid:
  cols: 5
  rows: 3
  stagger: [0, -0.58, -0.74, -0.58, -0.48]   # [pinky, ring, middle, index, inner]

# --- Rotated keys (disabled) ---
# Rotate individual grid keys around their center (e.g. to clear a trackpoint).
# Uncomment and adjust as needed. Rotation is negated on the mirrored right half.
#
# rotated_keys:
#   - { row: 1, col: 3, rotation: -180 }  # index home
#   - { row: 0, col: 4, rotation: 90 }    # inner top
#   - { row: 1, col: 4, rotation: 90 }    # inner home

# --- Thumb cluster ---
# Only the left half is defined; the right half is mirrored automatically.
#
# Placement model:
#   The first thumb key's top-left corner is placed at the bottom-right
#   corner of the last ortho key (2,4) + the grid gap. Then it's rotated.
#   Each subsequent key chains from the previous one, maintaining the
#   same gap between adjacent keycap edges.
#
#   anchor (key 2,4)
#     ┌───────┐
#     │       │
#     •───────┘
#     ↓ gap
#     •───────┐     ┌───────┐
#  tl │  3,3  │     │  3,4  │
#     └───────•─gap─•───────┘
#
# keys:        number of thumb keys per half.
# angle:       rotation of the first thumb key (degrees CW).
# angle_step:  additional rotation per subsequent key (degrees CW).
# offset:      [dx, dy] optional shift of first key from default position.
#
# Gap between keys is automatically matched to the ortho grid gap.
# At angle=0 and angle_step=0, thumb keys align flush with ortho spacing.
#
thumb:
  keys: 2
  angle: 14                    # first key rotation (degrees CW)
  angle_step: 7                # additional rotation per key (degrees CW)
  offset: [0.23, 0]             # [dx, dy] shift of first key — ~1/4 keycap width right

# ──────────────────────────────────────────────────────────────────────
# Physical dimensions below (mm). Used by pcb_build.py for trackpoint
# holes, controller placement, and edge cuts. Not used by layout2kle.py.
# ──────────────────────────────────────────────────────────────────────

# --- Controller ---
# XIAO BLE (nRF52840) — placed above the outermost key by pcb_build.py.
#
controller:
  model: xiao_ble_plus         # Seeed XIAO nRF52840 Plus — same chip as BLE Sense, 9 added bottom pads (D11–D19)
  footprint: "Seeed_XIAO:XIAO-nRF52840-Plus-SMD"
  symbol: "Seeed_Studio_XIAO_Series:XIAO-nRF52840_Plus_SMD"
  box: [17.78, 21.0]           # [w, h] body dimensions (mm) — Plus body identical to regular XIAO BLE (only adds bottom pads)
  placement: above             # above the grid (between grid and PCB edge)
  edge_offset: -0.5           # shift along the edge (key units)
  standoff: 0.0               # distance from grid edge (mm) — 0 = flush with key box

# --- Trackpoint ---
# Strain-gauge sensor (Sprintek SK8707-01 sensor only) read via external ADS1220 ADC over SPI.
# Stick center = centroid of the 4 keys at the intersection of these cols/rows.
# Both halves carry a trackpoint module.
#
trackpoint:
  module: sk8707_sensor        # Sprintek SK8707 strain-gauge sensor (no companion PCB)
  between: { cols: [3, 4], rows: [0, 1] }   # centroid of these 4 keys
  center_hole: 6.0             # stick hole diameter (mm) — 1mm clearance over module spec
  screw_holes:
    diameter: 2.2              # M2 screw hole (mm)
    offset: 9.5                # Y distance from center to each screw (mm) — 19mm apart per datasheet
  # 3D model — sensor only (latest design has no companion flex PCB)
  assembled_step: "SK8707.STEP"  # sensor module STEP in 3dmodels/
  stick_offset_y: 1.70         # stick center Y offset from sensor bbox center (mm)
  # Use solder (THT) footprint for the 4 keys surrounding the trackpoint.
  # This avoids the hotswap socket bulk that interferes with the trackpoint module.
  solder_keys: false
  solder_footprint: "Switch_Keyboard_Kailh:SW_Kailh_Choc_V1"
  # ADS1220 strain-gauge ADC — placed on B.Cu close to the trackpoint sensor.
  # Sensor's 4 pads ([x][y][a][b]) hand-soldered directly to AIN0/AIN1/REFP0/REFN0.
  # SPI (SCK/MOSI/MISO/CS) and DRDY route to the XIAO across the board (digital, length-tolerant).
  adc:
    type: ads1220
    footprint: "Package_SO:TSSOP-16_4.4x5mm_P0.65mm"
    symbol: "Analog_ADC:ADS1220xPW"  # TSSOP-16 variant — pin numbers match the footprint
    offset: [0.0, -15.0]         # [x, y] mm from trackpoint center — above top screw hole, X-aligned with stick
    rotation: 0                   # rotation in degrees
    ref_resistor: 2400            # ohms, 0.1% — sets ADC reference via IDAC × R

# --- Power switch ---
# C&K PCM13 — SP3T ultra-miniature slide switch (off / xiao / xiao+trackpoint)
# Placed on B.Cu near the controller area
power_switch:
  footprint: "Button_Switch_SMD:SW_SP3T_PCM13"
  symbol: "Switch:SW_SP3T"
  placement: controller          # place near the XIAO controller
  offset: [20.8, -2.3]           # [x, y] mm offset from controller center (right & slightly up)
  rotation: 0

# --- Case ---
# Physical case dimensions for future CAD generation.
#
case:
  plate_padding: 2.0           # mm from switch cutout edge to outline
  wall: 2.0                    # outer wall thickness (mm)
  lip: 1.5                     # top lip overhang (mm)
  depth: 10.0                  # interior depth below plate (mm)
  corner_radius: 3.0          # fillet radius on outer corners (mm)
  plate_thickness: 1.5
  bottom_thickness: 2.0
  pcb_thickness: 1.6

# --- PCB ---
# Settings used by kbplacer (editor.keyboard-tools.xyz) when generating the PCB.
# These are reminders for the manual web tool step, not consumed by scripts.
#
pcb:
  trace_width: 0.25            # mm
  clearance: 0.2               # mm

# --- Nets ---
# Electrical nets attached to placed footprint pads after kbplacer runs.
# kbplacer already creates COL*/Net-(D*-A) for the matrix; this section covers
# everything else: power, SPI, ADC analog, and decoupling.
#
# Schema:
#   NET_NAME:
#     <FOOTPRINT_REF>: [<pad_name_or_index>, ...]
#
# Pad keys may be strings (looked up via FindPadByName, e.g. "AVDD", "9", "D11")
# or integers (looked up positionally via Pads()[i]).
#
# Mirror rule: any net whose name ends in "_L" is auto-mirrored to "_R" by
# replacing every "_L" footprint reference with the "_R" equivalent.
# Override the mirror by writing an explicit "_R" entry alongside the "_L" one.
#
# Notes:
# - Re-running `just pcb` overwrites tools/build/atlas.kicad_pcb, so manual
#   routing in pcbnew is lost on rebuild. Route after the design is stable.
# - The legacy pcb/atlas/atlas.kicad_sch is no longer maintained — this YAML
#   is the source of truth for non-matrix nets.
# - Populated incrementally; add nets here as components and wiring stabilize.
#
nets:
  # ─── Power ─────────────────────────────────────────────────────────
  # XIAO BLE Plus pinout: pad 12 = 3V3 out, pad 13 = GND, pad 14 = 5V (VBUS)
  # ADS1220 TSSOP-16 (per TI ADS1220 datasheet, matches KiCad ADS1220xPW symbol):
  #   pin 1=SCLK 2=~CS 3=CLK 4=DGND 5=AVSS 6=AIN3 7=AIN2 8=REFN0 9=REFP0
  #   pin 10=AIN1 11=AIN0 12=AVDD 13=DVDD 14=~DRDY 15=DOUT 16=DIN
  # All decouplers + sensor pads tie to VCC / GND single nets.
  VCC:
    U_L:        ["12"]                           # 3V3 from XIAO BLE Plus
    U_R:        ["12"]
    U_ADC_L:    ["12", "13"]                     # AVDD + DVDD
    U_ADC_R:    ["12", "13"]
    C_AVDD_L1:  ["1"]                            # AVDD 100nF
    C_AVDD_L2:  ["1"]                            # AVDD 10µF bulk
    C_DVDD_L1:  ["1"]                            # DVDD 100nF
    C_AVDD_R1:  ["1"]
    C_AVDD_R2:  ["1"]
    C_DVDD_R1:  ["1"]
  GND:
    U_L:        ["13"]
    U_R:        ["13"]
    U_ADC_L:    ["4", "5"]                       # DGND + AVSS (single-point star at chip)
    U_ADC_R:    ["4", "5"]
    C_AVDD_L1:  ["2"]
    C_AVDD_L2:  ["2"]
    C_DVDD_L1:  ["2"]
    C_AVDD_R1:  ["2"]
    C_AVDD_R2:  ["2"]
    C_DVDD_R1:  ["2"]

  # ─── ADS1220 reference voltage divider ────────────────────────────
  # IDAC1 (current source) routes internally to REFP0; current returns through
  # the bridge to REFN0=AVSS. Reference voltage is 500µA × 2400Ω = 1.2V across
  # the divider AIN2 ↔ REFP0/REFN0. AIN2 is the midpoint of the two ref resistors.
  REFP0_L:
    U_ADC_L:    ["9"]                            # REFP0 — also internally driven by IDAC1
    R_REF_L1:   ["1"]                            # one side of first ref resistor
    TP_L_pad_a: ["1"]                            # sensor "[a]" excitation high
  REFN0_L:
    U_ADC_L:    ["8"]                            # REFN0 (tied to AVSS via sensor [b])
    R_REF_L2:   ["1"]                            # one side of second ref resistor
    TP_L_pad_b: ["1"]                            # sensor "[b]" excitation low (also = AVSS)
  AIN2_L:
    U_ADC_L:    ["7"]                            # AIN2 — midpoint of ref divider
    R_REF_L1:   ["2"]                            # other side of first ref resistor
    R_REF_L2:   ["2"]                            # other side of second ref resistor

  # ─── ADS1220 strain-gauge inputs ──────────────────────────────────
  AIN0_L:
    U_ADC_L:    ["11"]                           # AIN0 (also REFP1, unused as ref here)
    TP_L_pad_x: ["1"]                            # sensor "[x]" — X-axis strain output
  AIN1_L:
    U_ADC_L:    ["10"]                           # AIN1
    TP_L_pad_y: ["1"]                            # sensor "[y]" — Y-axis strain output

  # ─── ADS1220 SPI bus (XIAO Plus secondary SPI peripheral) ────────
  # Per reference_xiao_ble_plus_pinout.md (memory):
  #   pad 21 = D17 = P1.03 = SCK1   (secondary SPI clock)
  #   pad 22 = D18 = P1.05 = MISO1  (DOUT)
  #   pad 23 = D19 = P1.07 = MOSI1  (DIN)
  #   pad 15 = D11 = P0.15          (free, used here for CS)
  #   pad 16 = D12 = P0.19          (free, used here for DRDY)
  # Primary SPI (D8/D9/D10) is reserved for matrix columns; secondary SPI keeps
  # them free.
  SPI_SCK_L:
    U_ADC_L:    ["1"]                            # ADS1220 SCLK
    U_L:        ["21"]                           # XIAO Plus pad 21 = D17 = SCK1
  SPI_MOSI_L:
    U_ADC_L:    ["16"]                           # ADS1220 DIN
    U_L:        ["23"]                           # XIAO Plus pad 23 = D19 = MOSI1
  SPI_MISO_L:
    U_ADC_L:    ["15"]                           # ADS1220 DOUT
    U_L:        ["22"]                           # XIAO Plus pad 22 = D18 = MISO1
  SPI_CS_L:
    U_ADC_L:    ["2"]                            # ADS1220 ~CS
    U_L:        ["15"]                           # XIAO Plus pad 15 = D11 = P0.15
  SPI_DRDY_L:
    U_ADC_L:    ["14"]                           # ADS1220 ~DRDY
    U_L:        ["16"]                           # XIAO Plus pad 16 = D12 = P0.19

# --- Per-half overrides ---
left:
  trackpoint: true
  connectors:
    - { name: tp_bridge, footprint: totem:5pin, near: trackpoint, side: above }
    - { name: battery,   footprint: totem:2pin, near: controller, side: below, offset: -15 }

right:
  trackpoint: true
  connectors:
    - { name: tp_bridge, footprint: totem:5pin, near: trackpoint, side: above }
    - { name: battery,   footprint: totem:2pin, near: controller, side: below, offset: -15 }
