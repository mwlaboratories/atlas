# Phase 1 bench test — ADS1220 SPI smoke test on XIAO nRF52840 Plus.
#
# This build is wired for a XIAO Plus with a broken MISO1 (D18 / P1.05)
# tab. MISO is remapped to D13 (I2S_WS / P1.01) — see app.overlay.

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_PINCTRL=y

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_DEFAULT_LEVEL=3

# USB CDC ACM serial console — host sees /dev/ttyACM0 after enumeration.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Atlas ADS1220 test"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=1024
