# Dongle: the ESB central. Keyless XIAO on USB (no battery, no sleep needed);
# runs the keymap and sends HID to the host. No BLE at all.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y

# ESB link
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_FIFO_SIZE=1
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# Re-sync held keys if a release packet is lost (= keys on the board)
CONFIG_ZMK_SPLIT_ESB_AUTO_HEAL_KEY_POS_MAX=34

# Peripheral battery levels. The BLE-named options are what the ESB module
# uses too: room for 2 peripherals (ids 1, 2), levels fetched to the central.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Mouse keys in the keymap (&mkp, &mmv)
CONFIG_ZMK_POINTING=y

# strata: layer + both halves' battery to the host over raw HID, a second
# USB HID device next to the keyboard. The ESB radio-stats hooks
# (STRATA_LINK_ESB_STATS) aren't in upstream zmk-feature-split-esb, so the
# tray shows online/offline per half but no signal bars.
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_RAW_HID=y
CONFIG_RAW_HID_USAGE_PAGE=0xFF60
CONFIG_RAW_HID_USAGE=0x61
CONFIG_RAW_HID_REPORT_SIZE=32
CONFIG_STRATA_LAYER_REPORT=y
CONFIG_STRATA_ROLE_DONGLE=y
CONFIG_STRATA_BATTERY_REPORT_CENTRAL=n

# USB logging, for debugging:
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_DBG=y
