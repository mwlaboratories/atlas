# ADS1220 strain-gauge trackpoint on a half (ADS1220=1 builds, see
# build-firmware.sh). The two drivers switch themselves on from the devicetree
# (ads1220.dtsi); this is what they need around them.
CONFIG_SPI=y
CONFIG_ADC=y
# Input subsystem + the split's input-event channel to the dongle
CONFIG_ZMK_POINTING=y

# What zmk-feature-split-esb asks for when input events go over the link
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_INPUT_QUEUE_MAX_MSGS=128

# Sampling thread. The module's 762-byte default has to hold the SPI call
# chain and double-precision scaling; its real use is not measured, so it
# gets room.
CONFIG_INPUT_ANALOG_AXIS_HIRES_THREAD_STACK_SIZE=2048
# The rest position is measured at every boot, nothing to store.
CONFIG_INPUT_ANALOG_AXIS_HIRES_SETTINGS=n

# Bring-up, over USB: registers written, calibration result, every sample.
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_ADC_LOG_LEVEL_DBG=y
# CONFIG_INPUT_LOG_LEVEL_DBG=y
