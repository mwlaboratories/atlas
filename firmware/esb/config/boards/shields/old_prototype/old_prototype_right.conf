# Right half: ESB peripheral 2 of the dongle. No BLE at all.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_ID=2

# ESB link (zmk-feature-split-esb defaults: ACK + retransmit, RF channel
# hopping on interference, CRC postfix). A half only keys the radio when it
# has something to send; it never holds a connection open like BLE does.
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_FIFO_SIZE=1
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# +8 dBm TX (module default). Each burst is well under 1 ms, so the extra
# current hardly shows in battery life, while fewer retransmits and channel
# hops do. Set =n only if the dongle sits right next to the board.
# CONFIG_ZMK_SPLIT_ESB_CTLR_TX_PWR_PLUS_8=n

# Power: deep sleep after 15 min idle (any key wakes it), no logging.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Battery level to the dongle; the zmk-strata heartbeat re-sends it every
# 30 s so an idle half doesn't look disconnected in the strata tray.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_STRATA_HEARTBEAT=y

# In-order delivery (2026-11-12). The module's app-level retry re-queues a
# failed key event *behind* newer ones and re-sends it as a fresh packet, so a
# press can land after its release (stuck key, e.g. a GUI held 78 s) and an
# ACK-lost press arrives twice (dongle auto-heal → release+press 1.0 ms apart,
# a doubled key). Channel hopping is tied to those retries (the half hops on
# fail, then retries until it wraps back to the dongle's channel), so both go
# together. What's left is the radio's own retransmits: in order, deduplicated
# by packet ID in hardware. 15 × 600 µs ≈ 9 ms worst case per event.
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP=n
CONFIG_ZMK_SPLIT_ESB_RETRY_KEY_POSITION=0
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_COUNT=15
