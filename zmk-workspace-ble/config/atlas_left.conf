# Central (left) half only. The central holds the aggregated layer state and
# is the half that talks HID to the host, so the laymap layer reporter lives
# here. See repos/laymap.
#
# Requires the zmk-raw-hid and zmk-laymap modules in the build (via
# ZMK_EXTRA_MODULES for local iteration, or config/west.yml for the nix build).
# If those modules are absent these symbols are simply unknown (a Kconfig
# warning), so this file is harmless to a stock build.

CONFIG_RAW_HID=y
CONFIG_RAW_HID_USAGE_PAGE=0xFF60
CONFIG_RAW_HID_USAGE=0x61
CONFIG_RAW_HID_REPORT_SIZE=32

CONFIG_LAYMAP_LAYER_REPORT=y
